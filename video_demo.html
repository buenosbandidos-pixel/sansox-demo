<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><title>Tekstitysdemo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#FBFAF7;color:#141A18;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:30px;max-width:900px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em}
.vwrap{position:relative;border:1.5px solid #0E322A;background:#000}
.vwrap video{width:100%;display:block;aspect-ratio:16/9;background:#000}
/* peittopalkki: kattaa poltetun englannin koko vaihteluvälin */
.subcover{position:absolute;left:0;right:0;bottom:0;height:21%;background:#0E322A;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 4%;pointer-events:none}
.subcover span{color:#EAF2ED;font-size:clamp(13px,2.3vw,19px);line-height:1.35;font-weight:600;
  text-wrap:balance}
.langbtns{display:flex;gap:8px;margin:14px 0}
.langbtns button{font:700 13px/1 inherit;padding:9px 14px;border:1.5px solid #0E322A;
  background:transparent;color:#0E322A;cursor:pointer}
.langbtns button.on{background:#0E322A;color:#EAF2ED}
.note{color:#59635E;font-size:14px}
</style></head><body>
<h1>Upotettu video, poltettu englanti peitetty — omat tekstitykset EN/FI/ES</h1>
<div class="vwrap">
  <video id="v" controls preload="auto" poster="assets/video/proven_poster.jpg?v=4">
    <source src="assets/video/oxtube_proven.mp4?v=4" type="video/mp4">
    <track kind="subtitles" src="assets/video/oxtube_proven.fi.vtt" srclang="fi" label="Suomi">
    <track kind="subtitles" src="assets/video/oxtube_proven.en.vtt" srclang="en" label="English">
    <track kind="subtitles" src="assets/video/oxtube_proven.es.vtt" srclang="es" label="Español">
  </video>
  <div class="subcover"><span id="sub"></span></div>
</div>
<div class="langbtns">
  <button data-l="fi" class="on">Suomi</button>
  <button data-l="en">English</button>
  <button data-l="es">Español</button>
</div>
<p class="note">Palkki peittää videoon poltetun englanninkielisen tekstityksen; valittu kieli piirretään palkkiin. Video: "Has OxTube results been proven" (1:31), SansOxin oma materiaali.</p>
<script>
(function(){
var v=document.getElementById('v'),sub=document.getElementById('sub'),cur='fi';
function tracks(){return Array.prototype.slice.call(v.textTracks);}
function use(l){
  cur=l;
  tracks().forEach(function(t){t.mode='hidden';});
  document.querySelectorAll('.langbtns button').forEach(function(b){b.classList.toggle('on',b.dataset.l===l);});
  render();
}
function render(){
  var t=tracks().find(function(t){return t.language===cur;});
  if(!t){sub.textContent='';return;}
  var c=t.activeCues&&t.activeCues[0];
  sub.textContent=c?c.text:'';
}
v.addEventListener('loadedmetadata',function(){
  tracks().forEach(function(t){t.mode='hidden';t.addEventListener('cuechange',render);});
  use('fi');
});
document.querySelectorAll('.langbtns button').forEach(function(b){
  b.addEventListener('click',function(){use(b.dataset.l);});
});
})();
</script>
</body></html>
